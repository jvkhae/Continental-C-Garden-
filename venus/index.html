<title>venus_event-menu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #f5e9e6;
    --muted: #d9c3c0;
    --rose: #d9a878;
    --rose-dim: #8a6547;
    --card: #2c1319;
    --scrim-top: rgba(20,8,12,.55);
    --scrim-bottom: rgba(12,5,8,.92);
  }
  html, body { height: 100%; }
  body {
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    background: #170a10;
    overflow-x: hidden;
  }

  .bg-photo {
    position: fixed;
    inset: -6vh -4vw;
    background-image:
      linear-gradient(180deg, var(--scrim-top) 0%, rgba(23,10,16,.45) 35%, var(--scrim-bottom) 100%),
      url('hotel-exterior.jpg');
    background-size: cover;
    background-position: center 35%;
    will-change: transform;
    z-index: 0;
  }

  .content { position: relative; z-index: 1; }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: clamp(40px, 9vw, 76px) 20px 48px;
  }

  header { text-align: center; margin-bottom: clamp(40px, 9vw, 68px); }
  .eyebrow {
    font-size: 12px;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--rose);
    font-weight: 600;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(2.6rem, 8vw, 3.8rem);
    margin: 10px 0 10px;
    text-wrap: balance;
    text-shadow: 0 4px 24px rgba(0,0,0,.4);
  }
  .sub { color: var(--muted); font-size: 14px; max-width: 42ch; margin: 0 auto; }

  .menus { display: flex; flex-direction: column; gap: clamp(56px, 12vw, 96px); }

  .menu-block { text-align: center; }
  .menu-label {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 16px;
  }
  .menu-label .n {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.5rem;
    color: var(--rose);
  }
  .menu-label .price {
    font-size: 12.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--rose-dim);
    padding: 5px 12px;
    border-radius: 999px;
  }

  .frame {
    background: var(--card);
    border: 1px solid rgba(217,168,120,.25);
    padding: 10px;
    box-shadow: 0 40px 80px -24px rgba(0,0,0,.65);
  }
  .frame img {
    display: block;
    width: 100%;
    height: auto;
  }

  footer {
    text-align: center;
    margin-top: clamp(56px, 12vw, 88px);
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .03em;
  }
  footer .div { color: var(--rose); margin: 0 8px; }

  @media (prefers-reduced-motion: reduce) {
    .bg-photo { transform: none !important; }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<div class="bg-photo" id="bgPhoto"></div>

<div class="content">
  <div class="wrap">
    <header>
      <div class="eyebrow">Venus Restaurant</div>
      <h1>Event Menu</h1>
      <p class="sub">Three set menus for weddings, receptions &amp; private events</p>
    </header>

    <div class="menus">
      <section class="menu-block">
        <div class="menu-label"><span class="n">Menu 1</span><span class="price">150,000 ₮</span></div>
        <div class="frame">
          <img src="menu-150000.webp" alt="Menu 1 — 150,000 MNT: Caesar salad, miso chicken or meatloaf, poached pear" loading="lazy">
        </div>
      </section>

      <section class="menu-block">
        <div class="menu-label"><span class="n">Menu 2</span><span class="price">180,000 ₮</span></div>
        <div class="frame">
          <img src="menu-180000.webp" alt="Menu 2 — 180,000 MNT: milk skin vegetable salad, pork belly or beef steak, Spartak cake" loading="lazy">
        </div>
      </section>

      <section class="menu-block">
        <div class="menu-label"><span class="n">Menu 3</span><span class="price">250,000 ₮</span></div>
        <div class="frame">
          <img src="menu-250000.webp" alt="Menu 3 — 250,000 MNT: crispy duck orange salad, royal skirt beef steak or salmon fillet, red velvet cake" loading="lazy">
        </div>
      </section>
    </div>

    <footer>
      Venus <span class="div">&#9670;</span> All prices exclude 12% tax
    </footer>
  </div>
</div>

<script>
(function () {
  var bg = document.getElementById('bgPhoto');
  var ticking = false;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function update() {
    ticking = false;
    if (reduceMotion) return;
    var y = window.scrollY || window.pageYOffset;
    bg.style.transform = 'translateY(' + (y * 0.22) + 'px)';
  }
  function onScroll() {
    if (!ticking) {
      window.requestAnimationFrame(update);
      ticking = true;
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  update();
})();
</script>
