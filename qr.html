<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C Garden — Scan Menu</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root{ --emerald:#1f9d6b; --emerald-2:#2fd693; --gold:#d9c27a; --ink:#eaf3ee; --muted:#8fa89b; }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      font-family:'Inter',system-ui,sans-serif;color:var(--ink);
      background:
        radial-gradient(800px 500px at 50% -5%, rgba(31,157,107,.22), transparent 60%),
        linear-gradient(180deg,#05100b,#08160f);
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;padding:32px;
    }
    .tent{
      width:min(420px,92vw);text-align:center;
      background:linear-gradient(180deg,#0c1d15,#0a1810);
      border:1px solid rgba(120,200,160,.18);
      border-radius:26px;padding:38px 34px 34px;
      box-shadow:0 30px 80px rgba(0,0,0,.6);
    }
    .logo{width:200px;max-width:70%;height:auto;margin-bottom:6px}
    .tag{color:var(--gold);letter-spacing:.4em;text-transform:uppercase;font-size:11px;font-weight:700}
    .qr-card{
      background:#fff;border-radius:18px;padding:18px;
      width:248px;height:248px;margin:24px auto 18px;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 10px 30px rgba(0,0,0,.4);
    }
    .qr-card img{width:100%;height:100%;display:block}
    h1{font-family:'Playfair Display',serif;font-size:26px;margin:4px 0 2px;font-weight:700}
    .mn-en{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 6px}
    .url{
      margin-top:14px;font-size:12px;color:var(--emerald-2);
      word-break:break-all;border-top:1px solid rgba(120,200,160,.18);padding-top:14px;
    }
    .diamond{color:var(--emerald-2)}
    @media print{
      body{background:#fff;color:#06120c}
      .tent{box-shadow:none;border:1px solid #cdd;background:#fff}
      .tag{color:#7a6a2e}.url{color:#1f7d56}.mn-en{color:#456}
      h1{color:#06120c}
      .logo{filter:invert(1) brightness(.2)}
    }
  </style>
</head>
<body>
  <div class="tent">
    <img class="logo" src="assets/logo.svg" alt="C Garden">
    <div class="tag">Food Menu</div>

    <div class="qr-card">
      <img src="assets/qr.svg" alt="Scan for menu">
    </div>

    <h1>Меню үзэх <span class="diamond">◆</span> Scan Menu</h1>
    <p class="mn-en">Утсаараа QR кодыг уншуулна уу<br>Scan with your phone camera</p>

    <div class="url">C Garden · Menu</div>
  </div>
</body>
</html>
