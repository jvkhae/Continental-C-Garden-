<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 375" role="img" aria-label="Truffle fries">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2419"/><stop offset="1" stop-color="#07140d"/>
    </linearGradient>
    <linearGradient id="fry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c879"/><stop offset="1" stop-color="#c69a3f"/>
    </linearGradient>
  </defs>
  <rect width="500" height="375" fill="url(#bg1)"/>
  <circle cx="250" cy="188" r="120" fill="#0c1d15" stroke="rgba(217,194,122,.25)" stroke-width="2"/>
  <!-- cone -->
  <path d="M200 120 L300 120 L270 285 L230 285 Z" fill="#10261b" stroke="#d9c27a" stroke-width="3"/>
  <!-- fries -->
  <g fill="url(#fry)" stroke="#a87f2e" stroke-width="2">
    <rect x="214" y="70" width="14" height="80" rx="4" transform="rotate(-12 221 110)"/>
    <rect x="234" y="60" width="14" height="92" rx="4" transform="rotate(-3 241 106)"/>
    <rect x="254" y="62" width="14" height="90" rx="4" transform="rotate(6 261 107)"/>
    <rect x="274" y="74" width="14" height="78" rx="4" transform="rotate(14 281 113)"/>
    <rect x="244" y="78" width="14" height="74" rx="4"/>
  </g>
  <!-- herbs -->
  <g fill="#2fd693"><circle cx="232" cy="150" r="4"/><circle cx="258" cy="158" r="3.5"/><circle cx="276" cy="150" r="3"/></g>
</svg>
