<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-label="DAZZLE">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe9e3"/>
    </linearGradient>
  </defs>
  <g fill="url(#shine)" font-family="'Playfair Display', Georgia, serif" font-size="84" font-weight="700" letter-spacing="10">
    <text x="14" y="92">DAZ</text>
    <text x="332" y="92">ZLE</text>
  </g>
  <!-- diamond in the exact middle -->
  <g transform="translate(300 52)">
    <rect x="-19" y="-19" width="38" height="38" transform="rotate(45)" fill="none" stroke="url(#shine)" stroke-width="4"/>
    <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)" fill="url(#shine)"/>
  </g>
</svg>
