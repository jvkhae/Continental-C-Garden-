<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" role="img" aria-label="C Garden">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe9e3"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd693"/><stop offset="1" stop-color="#1f9d6b"/>
    </linearGradient>
  </defs>
  <!-- leaf emblem -->
  <g transform="translate(310 30)">
    <path d="M0 36 C 0 8, 20 -6, 40 -6 C 40 22, 22 36, 0 36 Z" fill="url(#leaf)"/>
    <path d="M6 32 C 16 20, 28 10, 38 2" fill="none" stroke="#07140d" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g fill="url(#shine)" font-family="'Playfair Display', Georgia, serif" font-weight="700" letter-spacing="6">
    <text x="36" y="118" font-size="92">C</text>
    <text x="118" y="118" font-size="72">GARDEN</text>
  </g>
  <text x="38" y="142" fill="#d9c27a" font-family="'Inter',sans-serif" font-size="15" letter-spacing="8">DRINKS MENU</text>
</svg>
