<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 375" role="img" aria-label="Cheese board">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2419"/><stop offset="1" stop-color="#07140d"/>
    </linearGradient>
  </defs>
  <rect width="500" height="375" fill="url(#bg2)"/>
  <!-- board -->
  <ellipse cx="250" cy="210" rx="160" ry="58" fill="#3a2a18" stroke="#d9c27a" stroke-width="3"/>
  <ellipse cx="250" cy="202" rx="160" ry="58" fill="#5a4226"/>
  <!-- cheese wedges -->
  <path d="M150 200 L210 175 L218 205 Z" fill="#f0d98a" stroke="#c8ab55" stroke-width="2"/>
  <path d="M225 210 L300 188 L298 218 L240 226 Z" fill="#e8c879" stroke="#c8ab55" stroke-width="2"/>
  <rect x="305" y="186" width="58" height="26" rx="4" fill="#f4e3a8" stroke="#c8ab55" stroke-width="2" transform="rotate(-6 334 199)"/>
  <!-- grapes -->
  <g fill="#1f9d6b" stroke="#0c1d15" stroke-width="1.5">
    <circle cx="190" cy="205" r="9"/><circle cx="205" cy="212" r="9"/><circle cx="198" cy="222" r="9"/><circle cx="183" cy="216" r="8"/>
  </g>
  <!-- crackers -->
  <circle cx="320" cy="222" r="13" fill="#c79a5b" stroke="#8a6a34" stroke-width="2"/>
  <circle cx="345" cy="216" r="13" fill="#c79a5b" stroke="#8a6a34" stroke-width="2"/>
</svg>
